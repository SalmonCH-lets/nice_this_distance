<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>「よかったこの距離で」風 テロップ＆写真合成ジェネレーター</title>
  <meta name="description" content="画像や写真の上に「よかったこの距離で」風のパターン付きテロップを載せて合成画像を作成。scaleXによる自動横幅圧縮対応＆ローカル処理。">
  
  <!-- Google Fonts: Zen Maru Gothic (UIフォント), Shippori Mincho, Kaisei Opti, Dela Gothic One -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Kaisei+Opti:wght@700&family=Noto+Sans+JP:wght@700;900&family=Shippori+Mincho:wght@700;900&family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Old+Mincho:wght@700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./src/style.css">
</head>
<body class="theme-light">
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-icon">💬</div>
        <div>
          <h1>「よかったこの距離で」風 テロップジェネレーター</h1>
        </div>
      </div>
      <!-- User Requested Warning Banner -->
      <div class="privacy-badge warning-badge" title="個人情報が含まれる重要画像のアップロードはお控えください">
        <span class="badge-icon">⚠️</span>
        <span class="badge-text">念のため個人情報などが含まれる画像は送信・使用しないでください</span>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="app-workspace">
      <!-- Left Column: Canvas Preview Stage -->
      <section class="stage-section">
        <div class="stage-card">
          <div class="stage-header">
            <span class="stage-title">📷 リアルタイム合成プレビュー</span>
            <div id="scaleBadge" class="scale-badge" title="テキストが枠幅を超えた場合にX軸方向のみ自動縮小されます">
              <span class="scale-dot"></span>
              <span id="scaleBadgeText">ScaleX: 100% (標準)</span>
            </div>
          </div>

          <!-- Canvas Container -->
          <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="previewCanvas"></canvas>
          </div>

          <!-- Background Presets & Upload -->
          <div class="bg-presets-bar">
            <span class="preset-label">背景写真:</span>
            <label class="btn btn-primary-outline btn-sm upload-bg-btn">
              📷 自分の写真をアップロード
              <input type="file" id="bgFileInput" accept="image/*" style="display: none;">
            </label>
            <div class="preset-pills">
              <button class="preset-pill active" data-bg="sunset">🌅 夕焼け空</button>
              <button class="preset-pill" data-bg="night">🌃 夜景アニメ風</button>
              <button class="preset-pill" data-bg="room">🏠 部屋</button>
              <button class="preset-pill" data-bg="dark">⬛ ダーク</button>
              <button class="preset-pill" data-bg="transparent">🏁 透過グリッド</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Right Column: Control Panel -->
      <section class="controls-section">
        <div class="controls-card">
          
          <!-- Tab Navigation (Horizontally Scrollable) -->
          <nav class="tabs-nav">
            <button class="tab-btn active" data-tab="tab-text">💬 テキスト・フォント</button>
            <button class="tab-btn" data-tab="tab-style">✨ フチ・文字飾</button>
            <button class="tab-btn" data-tab="tab-banner">🎨 テロップ枠</button>
            <button class="tab-btn" data-tab="tab-scale">↔️ 自動横幅収縮</button>
          </nav>

          <div class="tabs-content">
            <!-- TAB 1: TEXT & FONT SETTINGS -->
            <div class="tab-pane active" id="tab-text">
              <div class="form-group">
                <label for="textInput" class="form-label">
                  メインテキスト
                  <span class="label-hint">※改行せず横に広がります</span>
                </label>
                <input type="text" id="textInput" class="form-input text-lg" value="よかったこの距離で" placeholder="表示したいテキストを入力...">
              </div>

              <div class="form-group">
                <label for="subtextInput" class="form-label">サブテキスト / 話者名（オプション）</label>
                <input type="text" id="subtextInput" class="form-input" value="" placeholder="例: 【キャラクター名】">
              </div>

              <!-- Font Selector & Custom Font File Upload -->
              <div class="form-group">
                <label for="fontSelect" class="form-label">
                  フォント
                  <span class="label-badge">極太明朝.ttf 使用中</span>
                </label>
                <div class="font-select-wrapper">
                  <select id="fontSelect" class="form-select">
                    <option value="'極太明朝', serif" selected>極太明朝 (font/極太明朝.ttf)</option>
                    <option value="'Shippori Mincho', serif">Shippori Mincho (Web極太明朝 900)</option>
                    <option value="'Zen Old Mincho', serif">Zen Old Mincho (Web極太明朝)</option>
                    <option value="'Kaisei Opti', serif">Kaisei Opti (エレガント明朝)</option>
                    <option value="'Dela Gothic One', sans-serif">Dela Gothic One (極太ゴシック)</option>
                    <option value="'Noto Sans JP', sans-serif">Noto Sans JP (ゴシック)</option>
                  </select>
                  <label class="btn btn-outline btn-sm upload-font-btn" title="お持ちのフォントファイル(.ttf/.otf/.woff)を読み込みます">
                    🔤 別のフォント(.ttf/.otf)を追加
                    <input type="file" id="fontFileInput" accept=".ttf,.otf,.woff,.woff2" style="display: none;">
                  </label>
                </div>
                <div id="loadedFontStatus" class="font-status-info" style="display: none;"></div>
              </div>

              <div class="form-row">
                <div class="form-group col-6">
                  <label for="fontSize" class="form-label">文字サイズ (<span id="fontSizeVal">140</span>px)</label>
                  <input type="range" id="fontSize" class="form-range" min="30" max="200" value="140">
                </div>
                <div class="form-group col-6">
                  <label for="letterSpacing" class="form-label">文字間隔 (<span id="letterSpacingVal">-10</span>px)</label>
                  <input type="range" id="letterSpacing" class="form-range" min="-30" max="30" value="-10">
                </div>
              </div>

              <!-- Text Scale X & Scale Y Sliders -->
              <div class="form-section-title">文字の縦横拡大率</div>
              <div class="form-row">
                <div class="form-group col-6">
                  <label for="textScaleX" class="form-label">
                    X拡大率 (横幅)
                    <span id="textScaleXVal">1.55</span>x
                  </label>
                  <input type="range" id="textScaleX" class="form-range" min="0.3" max="3.0" step="0.05" value="1.55">
                </div>
                <div class="form-group col-6">
                  <label for="textScaleY" class="form-label">
                    Y拡大率 (縦幅)
                    <span id="textScaleYVal">1.75</span>x
                  </label>
                  <input type="range" id="textScaleY" class="form-range" min="0.3" max="3.0" step="0.05" value="1.75">
                </div>
              </div>

              <div class="form-group">
                <label for="textColor" class="form-label">文字色</label>
                <div class="color-picker-wrapper">
                  <input type="color" id="textColor" class="form-color" value="#FFFFFF">
                  <span class="color-val" id="textColorHex">#FFFFFF</span>
                </div>
              </div>
            </div>

            <!-- TAB 2: STROKE & DECORATION -->
            <div class="tab-pane" id="tab-style">
              <div class="form-section-title">内側のフチ取り（ストローク1）</div>
              <div class="form-row">
                <div class="form-group col-6">
                  <label for="stroke1Color" class="form-label">フチ1の色</label>
                  <div class="color-picker-wrapper">
                    <input type="color" id="stroke1Color" class="form-color" value="#FFFFFF">
                    <span class="color-val" id="stroke1ColorHex">#FFFFFF</span>
                  </div>
                </div>
                <div class="form-group col-6">
                  <label for="stroke1Width" class="form-label">フチ1の太さ (<span id="stroke1WidthVal">0</span>px)</label>
                  <input type="range" id="stroke1Width" class="form-range" min="0" max="20" value="0">
                </div>
              </div>

              <div class="form-section-title">外側のフチ取り（ストローク2）</div>
              <div class="form-row">
                <div class="form-group col-6">
                  <label for="stroke2Color" class="form-label">フチ2の色</label>
                  <div class="color-picker-wrapper">
                    <input type="color" id="stroke2Color" class="form-color" value="#1E0E38">
                    <span class="color-val" id="stroke2ColorHex">#1E0E38</span>
                  </div>
                </div>
                <div class="form-group col-6">
                  <label for="stroke2Width" class="form-label">フチ2の太さ (<span id="stroke2WidthVal">0</span>px)</label>
                  <input type="range" id="stroke2Width" class="form-range" min="0" max="30" value="0">
                </div>
              </div>

              <div class="form-section-title">文字のドロップシャドウ</div>
              <div class="form-row">
                <div class="form-group col-6">
                  <label for="shadowColor" class="form-label">影の色</label>
                  <div class="color-picker-wrapper">
                    <input type="color" id="shadowColor" class="form-color" value="#000000">
                    <span class="color-val" id="shadowColorHex">#000000</span>
                  </div>
                </div>
                <div class="form-group col-6">
                  <label for="shadowBlur" class="form-label">影のぼかし (<span id="shadowBlurVal">0</span>px)</label>
                  <input type="range" id="shadowBlur" class="form-range" min="0" max="30" value="0">
                </div>
              </div>
            </div>

            <!-- TAB 3: BANNER & PATTERN -->
            <div class="tab-pane" id="tab-banner">
              <div class="form-group">
                <label class="form-label">
                  シームレス背景画像パターン
                  <span class="label-badge">送信された画像を使用中</span>
                </label>
                <div class="pattern-preview-box">
                  <div class="pattern-tile" id="patternTilePreview"></div>
                  <label class="btn btn-outline btn-sm">
                    🔄 別のパターン画像を選択
                    <input type="file" id="patternFileInput" accept="image/*" style="display: none;">
                  </label>
                  <button class="btn btn-outline btn-sm" id="resetPatternBtn">元画像に戻す</button>
                </div>
              </div>

              <div class="form-row">
                <div class="form-group col-6">
                  <label for="patternScale" class="form-label">パターン倍率 (<span id="patternScaleVal">0.7</span>x)</label>
                  <input type="range" id="patternScale" class="form-range" min="0.2" max="3.0" step="0.05" value="0.7">
                </div>
                <div class="form-group col-6">
                  <label for="bannerPaddingX" class="form-label">左右パディング (<span id="bannerPaddingXVal">10</span>px)</label>
                  <input type="range" id="bannerPaddingX" class="form-range" min="0" max="250" value="10">
                </div>
              </div>

              <div class="form-row">
                <div class="form-group col-6">
                  <label for="bannerHeight" class="form-label">枠の高さ (<span id="bannerHeightVal">288</span>px)</label>
                  <input type="range" id="bannerHeight" class="form-range" min="60" max="400" value="288">
                </div>
                <div class="form-group col-6">
                  <label for="bannerRadius" class="form-label">角丸 (<span id="bannerRadiusVal">0</span>px)</label>
                  <input type="range" id="bannerRadius" class="form-range" min="0" max="50" value="0">
                </div>
              </div>

              <div class="form-row">
                <div class="form-group col-6">
                  <label for="bannerBorderColor" class="form-label">枠線（ボーダー）色</label>
                  <div class="color-picker-wrapper">
                    <input type="color" id="bannerBorderColor" class="form-color" value="#FFFFFF">
                    <span class="color-val" id="bannerBorderColorHex">#FFFFFF</span>
                  </div>
                </div>
                <div class="form-group col-6">
                  <label for="bannerBorderWidth" class="form-label">枠線の太さ (<span id="bannerBorderWidthVal">0</span>px)</label>
                  <input type="range" id="bannerBorderWidth" class="form-range" min="0" max="15" value="0">
                </div>
              </div>

              <div class="form-group">
                <label for="bannerPosY" class="form-label">上下位置 (底からの高さ: <span id="bannerPosYVal">18</span>%)</label>
                <input type="range" id="bannerPosY" class="form-range" min="5" max="85" value="18">
              </div>
            </div>

            <!-- TAB 4: SCALEX AUTO COMPRESSOR -->
            <div class="tab-pane" id="tab-scale">
              <div class="info-callout">
                <div class="callout-icon">💡</div>
                <div class="callout-content">
                  <strong>自動横幅収縮 (scaleX) について</strong>
                  <p>テキストが長くなり「テロップ最大幅」を超えた場合にのみ、文字の横幅（X軸）を自動で収縮させて枠内に収めます。</p>
                </div>
              </div>

              <div class="form-group">
                <label class="form-switch-label">
                  <input type="checkbox" id="scaleXEnabled" class="form-switch" checked>
                  <span>scaleX 自動横幅圧縮を有効化</span>
                </label>
              </div>

              <div class="form-group">
                <label for="maxWidthPercent" class="form-label">
                  テロップ最大幅 (<span id="maxWidthPercentVal">85</span>%)
                  <span class="label-hint">※写真全体の幅に対する最大パーセンテージ</span>
                </label>
                <input type="range" id="maxWidthPercent" class="form-range" min="30" max="98" value="85">
              </div>
            </div>
          </div>

          <!-- Download Action Bar -->
          <div class="actions-bar">
            <button id="downloadCompositeBtn" class="btn btn-primary btn-lg btn-block">
              📥 合成写真をダウンロード (高解像度PNG)
            </button>
            <div class="secondary-actions">
              <button id="downloadTransparentBtn" class="btn btn-secondary btn-multiline">
                🖼️ テロップのみ<br><span class="btn-subtext">（透過PNG）</span>
              </button>
              <button id="copyClipboardBtn" class="btn btn-secondary">
                📋 クリップボードにコピー
              </button>
            </div>
          </div>

        </div>
      </section>
    </main>
  </div>

  <!-- Non-overlapping Extreme Bottom-Right Theme Toggle Drawer -->
  <div class="theme-drawer-wrapper">
    <button id="themeToggleBtn" class="theme-drawer-btn hidden" title="テーマ切り替え">
      <span id="themeToggleIcon" class="toggle-icon">🌙</span>
      <span id="themeToggleText">ダークモードにする</span>
    </button>
    <button id="themeFabBtn" class="theme-fab-btn" title="テーマ設定">
      <span>▲</span>
    </button>
  </div>

  <!-- Embed base64 pattern script first, then main logic -->
  <script src="./src/patternBase64.js"></script>
  <script src="./src/main.js"></script>
</body>
</html>
